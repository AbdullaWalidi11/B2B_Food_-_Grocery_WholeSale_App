version: '3.8'

services:
  # In-memory data store for BullMQ background queues & future catalog caching
  redis:
    image: redis:7-alpine
    container_name: b2b_wholesale_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  redis_data:
    driver: local
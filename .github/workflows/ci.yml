name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Verify Backend Build
        run: |
          cd backend
          pnpm install
          npx prisma generate
          pnpm run build

      - name: Verify Frontend Build
        env:
          NEXT_PUBLIC_API_URL: "https://b2bfood-grocerywholesaleapp-production.up.railway.app"
        run: |
          cd frontend
          pnpm install
          pnpm run build